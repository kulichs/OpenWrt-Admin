<div class="result preview{{ ' danger' if danger }}">
  <strong>{{ t("preview.title") }} · {{ ap }}</strong>
  <p>{% for c in changes %}{{ c }}<br>{% endfor %}</p>
  {% if warns %}<ul class="warnlist">{% for w in warns %}<li>⚠ {{ w }}</li>{% endfor %}</ul>{% endif %}
  <pre class="small">{{ cmds | join('\n') }}</pre>
  {% if note %}<p class="muted small">{{ note }}</p>{% endif %}
  <form hx-post="{{ base }}/services/apply" hx-target="closest .cmd-out" hx-disabled-elt="find button">
    <input type="hidden" name="token" value="{{ token }}">
    <button type="submit" class="{{ 'danger' if danger else 'warnbtn' }}">{{ t("svc.apply", ap=ap) }}</button>
    <span class="htmx-indicator muted">{{ t("preview.writing") }}</span>
  </form>
</div>
