{% extends "base.html" %}
{% block content %}
<h1><span class="dot {{ 'on' if ap.online else 'off' }}"></span> {{ ap.name }} <span class="tag">{{ t("router.kind") }}</span> <span class="muted">{{ ap.host }}</span></h1>
{% set devtab = "firewall" %}{% include "_devtabs.html" %}
{% if ready %}{% include "_firewall_body.html" %}
{% else %}
<div id="fw-body" hx-get="{{ base }}/ap/{{ ap.name | urlencode }}/firewall/body" hx-trigger="load" hx-swap="outerHTML">
  <p class="muted"><span class="spinner"></span> {{ t("fw.loading") }}</p>
</div>
{% endif %}
{% endblock %}
