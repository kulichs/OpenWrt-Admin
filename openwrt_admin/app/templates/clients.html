{% extends "base.html" %}
{% block content %}
<form class="filters" method="get" action="{{ base }}/clients">
  <input type="search" name="q" value="{{ q }}" placeholder="{{ t('clients.search') }}">
  <select name="ssid"><option value="">{{ t("clients.all_ssids") }}</option>
    {% for s in ssids %}<option {{ 'selected' if s == ssid }}>{{ s }}</option>{% endfor %}</select>
  <select name="ap"><option value="">{{ t("clients.all_aps") }}</option>
    {% for a in store.aps %}<option {{ 'selected' if a.name == ap }}>{{ a.name }}</option>{% endfor %}</select>
  <select name="band"><option value="">{{ t("clients.all_bands") }}</option>
    {% for b in bands %}<option value="{{ b }}" {{ 'selected' if b == band }}>{{ b | band }}</option>{% endfor %}</select>
  <button type="submit">{{ t("clients.filter") }}</button>
  <span class="muted">{{ t("clients.count", n=(clients | length)) }}</span>
</form>
{% set show_ap = true %}
{% include "_clients_table.html" %}
{% endblock %}
