{% extends "base.html" %}
{% block content %}
<form class="filters" method="get" action="{{ base }}/clients">
  <input type="search" name="q" value="{{ q }}" placeholder="Hledat jméno, IP, MAC">
  <select name="ssid"><option value="">Všechna SSID</option>
    {% for s in ssids %}<option {{ 'selected' if s == ssid }}>{{ s }}</option>{% endfor %}</select>
  <select name="ap"><option value="">Všechny AP</option>
    {% for a in store.aps %}<option {{ 'selected' if a.name == ap }}>{{ a.name }}</option>{% endfor %}</select>
  <select name="band"><option value="">Všechna pásma</option>
    {% for b in bands %}<option {{ 'selected' if b == band }}>{{ b }}</option>{% endfor %}</select>
  <button type="submit">Filtrovat</button>
  <span class="muted">{{ clients | length }} klientů</span>
</form>
{% set show_ap = true %}
{% include "_clients_table.html" %}
{% endblock %}
