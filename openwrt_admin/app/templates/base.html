<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWrt-Admin</title>
<script>
/* Tema podle Home Assistantu (Ingress bezi na stejne domene, localStorage je sdileny).
   selectedTheme.dark: true/false = vynucene, chybi = podle systemu. */
try {
  var t = JSON.parse(localStorage.getItem("selectedTheme") || "null");
  if (t && typeof t.dark === "boolean") document.documentElement.dataset.theme = t.dark ? "dark" : "light";
} catch (e) {}
</script>
<link rel="stylesheet" href="{{ base }}/static/style.css">
<script src="{{ base }}/static/htmx.min.js" defer></script>
</head>
<body>
<header>
  <nav>
    <a href="{{ base }}/" class="{{ 'active' if page == 'dashboard' }}">Přehled</a>
    <a href="{{ base }}/clients" class="{{ 'active' if page == 'clients' }}">Klienti</a>
    <a href="{{ base }}/ssids" class="{{ 'active' if page == 'ssids' }}">SSID</a>
    <span class="nav-sep"></span>
    {% for a in store.aps %}
    <a href="{{ base }}/ap/{{ a.name | urlencode }}" class="ap-tab {{ 'active' if page == 'ap:' ~ a.name }}"><span class="dot {{ 'on' if a.online else 'off' }}"></span>{{ a.name | replace('OpenWrt_', '') }}<span class="cnt">{{ a.client_count }}</span></a>
    {% endfor %}
    <span class="nav-sep"></span>
    <a href="{{ base }}/setup" class="{{ 'active' if page == 'setup' }}">Nastavení</a>
  </nav>
  <form method="post" action="{{ base }}/refresh?back={{ request.url.path | urlencode }}{{ ('%3F' ~ request.url.query | urlencode) if request.url.query }}">
    <span class="muted">Aktualizováno {{ store.last_poll | ago }}</span>
    <button type="submit">Obnovit</button>
  </form>
</header>
<main id="content"
      {% if autorefresh %}hx-get="{{ base }}{{ request.url.path }}{{ ('?' ~ request.url.query) if request.url.query }}"
      hx-trigger="every 30s" hx-select="#content" hx-target="#content" hx-swap="outerHTML" hx-disinherit="*"{% endif %}>
{% if store.opts.demo %}<div class="banner">Demo režim – zobrazená data jsou vymyšlená.</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
