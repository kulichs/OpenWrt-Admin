<!doctype html>
<html lang="{{ lang }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWrt-Admin</title><link rel="stylesheet" href="{{ base }}/static/style.css"></head>
<body><main>
<div class="panel">
  <h1>{{ t("denied.title") }}</h1>
  <p>{{ t("denied.text", user=(user.name or user.display or "?")) }}</p>
  {% if user.why %}<p class="muted small">{{ user.why }}</p>{% endif %}
  <p class="muted small">{{ t("denied.hint") }}</p>
</div>
</main></body></html>
