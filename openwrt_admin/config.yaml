name: OpenWrt-Admin
version: "0.28.0"
slug: openwrt_admin
description: Manage OpenWrt access points and Wi-Fi clients over SSH (overview, SSIDs, radios, network map, statistics, switches via SNMP, updates, backups)
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:access-point-network
panel_title: OpenWrt-Admin
panel_admin: false
homeassistant_api: true
options:
  ssh_user: root
  poll_interval: 30
  refresh_interval: 30
  language: auto
  demo: false
  full_access: []
  read_access: []
  ha_names: true
  names: []
  notify_new_devices: true
  notify_service: ""
  notify_random_mac: true
  new_device_hours: 24
  radio_scan: false
  update_check_hours: 12
  backup_interval_days: 7
  backup_keep: 10
  aps:
    - name: Router
      host: 192.168.1.1
      type: router
    - name: AP-Living
      host: 192.168.1.2
      type: ap
    - name: AP-Office
      host: 192.168.1.3
      type: ap
  switches: []
  stats: true
  stats_interval: 5
  ping_targets:
    - name: Cloudflare
      host: 1.1.1.1
    - name: Google DNS
      host: 8.8.8.8
  ping_devices: true
  traffic_source: auto
  top_clients: 10
  ha_sensors: false
  ha_sensors_interval: 30
schema:
  ssh_user: str
  poll_interval: int(10,600)
  refresh_interval: int(0,3600)?
  language: list(auto|cs|en)?
  dhcp_router: str?
  router_name: str?
  demo: bool
  full_access:
    - str
  read_access:
    - str
  ha_names: bool?
  names:
    - mac: str
      name: str
  notify_new_devices: bool?
  notify_service: str?
  notify_random_mac: bool?
  new_device_hours: int(0,720)?
  radio_scan: bool?
  update_check_hours: int(0,168)?
  backup_interval_days: int(0,90)?
  backup_keep: int(1,100)?
  aps:
    - name: str
      host: str
      port: port?
      user: str?
      type: list(ap|router)?
  switches:
    - name: str
      host: str
      community: str?
      port: port?
  stats: bool?
  stats_interval: int(2,60)?
  ping_targets:
    - name: str
      host: str
  ping_devices: bool?
  traffic_source: list(auto|nlbwmon|conntrack|off)?
  top_clients: int(3,50)?
  ha_sensors: bool?
  ha_sensors_interval: int(10,600)?
