name: OpenWrt-Admin
version: "0.9.1"
slug: openwrt_admin
description: Manage OpenWrt access points and Wi-Fi clients over SSH (overview, SSIDs, reboot, package updates)
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:access-point-network
panel_title: OpenWrt-Admin
panel_admin: false
options:
  ssh_user: root
  poll_interval: 30
  refresh_interval: 30
  language: auto
  demo: false
  full_access: []
  read_access: []
  aps:
    - name: Router
      host: 192.168.1.1
      type: router
    - name: AP-Living
      host: 192.168.1.2
      type: ap
    - name: AP-Office
      host: 192.168.1.3
      type: ap
schema:
  ssh_user: str
  poll_interval: int(10,600)
  refresh_interval: int(0,3600)?
  language: list(auto|cs|en)?
  dhcp_router: str?
  router_name: str?
  demo: bool
  full_access:
    - str
  read_access:
    - str
  aps:
    - name: str
      host: str
      port: port?
      type: list(ap|router)?
