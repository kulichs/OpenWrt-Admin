name: OpenWrt-Admin
version: "0.12.1"
slug: openwrt_admin
description: Manage OpenWrt access points and Wi-Fi clients over SSH (overview, SSIDs, network map, updates, backups)
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:access-point-network
panel_title: OpenWrt-Admin
panel_admin: false
homeassistant_api: true
options:
  ssh_user: root
  poll_interval: 30
  refresh_interval: 30
  language: auto
  demo: false
  full_access: []
  read_access: []
  ha_names: true
  names: []
  notify_new_devices: true
  notify_service: ""
  notify_random_mac: true
  update_check_hours: 12
  backup_interval_days: 7
  backup_keep: 10
  aps:
    - name: Router
      host: 192.168.1.1
      type: router
    - name: AP-Living
      host: 192.168.1.2
      type: ap
    - name: AP-Office
      host: 192.168.1.3
      type: ap
schema:
  ssh_user: str
  poll_interval: int(10,600)
  refresh_interval: int(0,3600)?
  language: list(auto|cs|en)?
  dhcp_router: str?
  router_name: str?
  demo: bool
  full_access:
    - str
  read_access:
    - str
  ha_names: bool?
  names:
    - mac: str
      name: str
  notify_new_devices: bool?
  notify_service: str?
  notify_random_mac: bool?
  update_check_hours: int(0,168)?
  backup_interval_days: int(0,90)?
  backup_keep: int(1,100)?
  aps:
    - name: str
      host: str
      port: port?
      type: list(ap|router)?
