configuration:
  ssh_user:
    name: SSH uživatel
    description: Uživatel, kterým se add-on přihlašuje na AP a router (obvykle root).
  poll_interval:
    name: Interval sběru dat (s)
    description: Jak často se načítají data z AP, 10–600 sekund.
  refresh_interval:
    name: Obnovování stránky (s)
    description: Jak často se otevřené stránky samy načtou znovu, v sekundách. 0 = vypnuto. Každý prohlížeč si to může změnit na stránce Nastavení.
  language:
    name: Jazyk
    description: Jazyk webového rozhraní. auto = podle jazyka uživatele Home Assistantu (nebo prohlížeče). Každý prohlížeč si ho může změnit na stránce Nastavení.
  dhcp_router:
    name: Router
    description: OpenWrt router (LAN, bez Wi-Fi), např. 192.168.1.1 nebo host:port. Zobrazí se jako samostatné zařízení (rozhraní, DHCP klienti, restart, aktualizace) a bere se z něj jméno a IP klientů. Prázdné = vypnuto.
  router_name:
    name: Název routeru
    description: Jak se router v add-onu jmenuje (karta a záložka), výchozí Router.
  demo:
    name: Demo režim
    description: Zobrazí vymyšlená data, bez SSH.
  full_access:
    name: Plný přístup
    description: Uživatelská jména HA, která smí restartovat, aktualizovat balíčky a měnit SSID. Když jsou oba seznamy prázdné, má plný přístup každý.
  read_access:
    name: Jen čtení
    description: Uživatelská jména HA, která smí jen prohlížet. Kdo není v žádném seznamu, nemá přístup.
  aps:
    name: Access pointy
    description: Seznam OpenWrt AP (název, adresa, volitelně SSH port).
