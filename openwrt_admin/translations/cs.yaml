configuration:
  ssh_user:
    name: SSH uživatel
    description: "Uživatel, kterým se add-on přihlašuje na AP a router (obvykle root)."
  poll_interval:
    name: Interval sběru dat (s)
    description: "Jak často se načítají data z AP, 10–600 sekund."
  refresh_interval:
    name: Obnovování stránky (s)
    description: "Jak často se otevřené stránky samy načtou znovu, v sekundách. 0 = vypnuto. Každý prohlížeč si to může změnit na stránce Nastavení."
  language:
    name: Jazyk
    description: "Jazyk webového rozhraní. auto = podle jazyka uživatele Home Assistantu (nebo prohlížeče). Každý prohlížeč si ho může změnit na stránce Nastavení."
  dhcp_router:
    name: Router (zastaralé)
    description: "Starý způsob nastavení routeru. Místo toho dej routeru v seznamu zařízení type router. Když je vyplněné, router se stane zařízení se stejnou IP."
  router_name:
    name: Název routeru (zastaralé)
    description: "Jen se zastaralým dhcp_router, když router není v seznamu zařízení."
  demo:
    name: Demo režim
    description: "Zobrazí vymyšlená data, bez SSH."
  full_access:
    name: Plný přístup
    description: "Uživatelská jména HA, která smí restartovat, aktualizovat balíčky a měnit SSID. Když jsou oba seznamy prázdné, má plný přístup každý."
  read_access:
    name: Jen čtení
    description: "Uživatelská jména HA, která smí jen prohlížet. Kdo není v žádném seznamu, nemá přístup."
  ha_names:
    name: Jména z Home Assistantu
    description: "Brát jména zařízení z registru zařízení Home Assistantu (podle MAC), např. ESPHome s pevnou IP."
  names:
    name: Ruční jména
    description: "Vlastní jména zařízení podle MAC (mac: aa:bb:cc:dd:ee:ff, name: …). Mají přednost před všemi ostatními zdroji."
  notify_new_devices:
    name: Upozornit na nová zařízení
    description: "Když se v síti objeví zařízení (MAC), které add-on ještě neviděl, pošle upozornění do Home Assistantu (zvoneček). Při prvním spuštění se všechna zařízení berou jako známá."
  notify_service:
    name: Služba pro upozornění
    description: "Volitelně i služba notify, např. notify.mobile_app_telefon (upozornění do mobilu). Prázdné = jen upozornění v HA."
  notify_random_mac:
    name: Upozorňovat i na náhodné MAC
    description: "Telefony používají pro každou Wi-Fi soukromou (náhodnou) MAC. Vypnuto = na takové adresy neupozorňovat."
  new_device_hours:
    name: Štítek „nové“ (h)
    description: "Jak dlouho od prvního výskytu má zařízení v tabulkách štítek nové, v hodinách (0–720). 0 = štítek se nezobrazuje."
  update_check_hours:
    name: Kontrola aktualizací (h)
    description: "Jak často se na každém zařízení zjišťují balíčky k aktualizaci (apk/opkg update) a nová verze OpenWrt. 0 = vypnuto."
  backup_interval_days:
    name: Automatická záloha (dny)
    description: "Jak často se ukládá záloha konfigurace (sysupgrade -b) každého zařízení do /data add-onu (je i v zálohách HA). 0 = vypnuto."
  backup_keep:
    name: Počet záloh
    description: "Kolik posledních záloh se drží pro každé zařízení."
  aps:
    name: Zařízení
    description: "Všechna spravovaná OpenWrt zařízení – add-on používá jen tato. Každé má název, adresu, volitelně SSH port a type ap (výchozí) nebo router. Router (jeden) se zobrazí s rozhraními a DHCP klienty a dává jména a IP klientů."
  switches:
    name: Switche (SNMP)
    description: "Volitelně spravované switche (Netgear, TP-Link, Cisco SG…), které se čtou přes SNMP v2c jen pro čtení: porty, rychlosti, VLANy a MAC adresy na portech – na mapě se ukážou se vším, co je do nich zapojené. Každý má název, adresu, community (výchozí public) a volitelně port (výchozí 161)."
  stats:
    name: Statistiky
    description: "Stránka Statistiky: rychlosti rozhraní routeru, teplota, ping, kdo nejvíc vytěžuje internet, provoz na portech switche a aktuální rychlost Wi-Fi klientů. Na zařízeních se nic neinstaluje."
  stats_interval:
    name: Interval statistik (s)
    description: "Jak často se čtou statistiky z routeru a čítače portů switchů, 2–60 sekund. Router má trvalé SSH spojení, AP se čtou dál podle poll_interval."
  ping_targets:
    name: Ping do internetu
    description: "Adresy v internetu, které router pinguje (name + host, IP nebo jméno). Podle nich se pozná, jestli internet funguje."
  ping_devices:
    name: Pingat zařízení v síti
    description: "Router pinguje i bránu poskytovatele, AP a switche ze seznamu zařízení."
  traffic_source:
    name: Zdroj provozu klientů
    description: "Odkud brát, kdo kolik stahuje z internetu. auto = nlbwmon, když na routeru běží, jinak conntrack. off = vypnuto."
  top_clients:
    name: Počet klientů v žebříčku
    description: "Kolik klientů s největším provozem do internetu se zobrazí (3–50)."
  ha_sensors:
    name: Senzory do Home Assistantu
    description: "Posílat statistiky do HA jako entity sensor.openwrt_admin_* a binary_sensor.openwrt_admin_* (rychlosti, ping, teplota, top klienti, porty switche) – mají historii a jdou do InfluxDB/Grafany."
  ha_sensors_interval:
    name: Interval senzorů (s)
    description: "Jak často se senzory v HA aktualizují, 10–600 sekund."
