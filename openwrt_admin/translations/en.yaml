configuration:
  ssh_user:
    name: SSH user
    description: User the add-on logs in as on the access points and the router (usually root).
  poll_interval:
    name: Poll interval (s)
    description: How often data is collected from the access points, 10–600 seconds.
  refresh_interval:
    name: Page refresh (s)
    description: How often open pages reload, in seconds. 0 = off. Each browser can override it on the Settings page.
  language:
    name: Language
    description: Web UI language. auto = language of the Home Assistant user (or the browser). Each browser can override it on the Settings page.
  dhcp_router:
    name: Router
    description: OpenWrt router (LAN, no Wi-Fi), e.g. 192.168.1.1 or host:port. Shown as its own device (interfaces, DHCP leases, reboot, updates) and used for client names and IPs. Empty = off.
  router_name:
    name: Router name
    description: Name of the router in the add-on (tab and card), default Router.
  demo:
    name: Demo mode
    description: Show made-up data, no SSH connections.
  full_access:
    name: Full access
    description: Home Assistant usernames allowed to reboot, update packages and change SSIDs. If both lists are empty, everyone has full access.
  read_access:
    name: Read-only access
    description: Home Assistant usernames that may only view. Anyone not in either list is denied.
  aps:
    name: Access points
    description: List of OpenWrt access points (name, host, optional SSH port).
